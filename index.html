<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de sèche</title>
<meta name="theme-color" content="#EEEBF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14111C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sèche">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Affiche de salle : blocs de couleur francs, bords encrés et ombres dures, chiffres énormes. Une colonne pour le pouce, barre d'onglets flottante avec le micro au centre. */
:root {
  --bg: #EEEBF7;
  --surface: #FFFFFF;
  --soft: #E3DEF1;
  --text: #15111E;
  --muted: #5E5870;
  --edge: #15111E;
  --drop: #15111E;
  --block-ink: #15111E;
  --tomato: #FF5B37;
  --cobalt: #3C55F5;
  --sun: #FFC72C;
  --mint: #35D896;
  --lilac: #B49BFF;
  --pink: #FF8CC6;
  --sky: #59C7FF;
  --ok: #35D896;
  --warn: #FFC72C;
  --over: #FF8CC6;
  --h0: #D6D0E6; --h1: #FFE6A1; --h2: #FFC72C; --h3: #FF9142; --h4: #FF5B37;
  --stage: #15111E;
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 20px;
  --bw: 2.5px;
  --sh: 4px 4px 0 var(--drop);
  --sh-s: 2.5px 2.5px 0 var(--drop);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14111C; --surface: #211C2D; --soft: #2C2639; --text: #F4F0FF; --muted: #A79FBC;
    --edge: #000000; --drop: #6A55E0;
    --h0: #3A3349; --stage: #0B0910;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: clamp(24px, 7.4vw, 34px); font-weight: 800; line-height: 1; white-space: nowrap; }
.top .when { min-width: 0; }
.top .when .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .seg { background: #fff; }
.blk .seg button { color: var(--block-ink); }
.blk .seg button[aria-pressed="true"] { background: var(--sun); color: var(--block-ink); }
h2 { font-size: 28px; font-weight: 800; line-height: 1.05; }
h3 { font-size: 21px; font-weight: 700; line-height: 1.15; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .02em; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.big { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: .9; }

/* Coque */
.top { position: sticky; top: 0; z-index: 6; background: var(--bg); padding-top: env(safe-area-inset-top); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; }
.top .when { display: grid; gap: 2px; }
.top .actions { display: flex; gap: 8px; align-items: center; }
.kgchip { border: var(--bw) solid var(--edge); background: var(--mint); color: var(--block-ink); border-radius: 999px; padding: 6px 12px; box-shadow: var(--sh-s); font-family: var(--f-display); font-weight: 800; font-size: 17px; line-height: 1; display: inline-flex; gap: 6px; align-items: baseline; }
.kgchip small { font-family: var(--f-mono); font-size: 10px; font-weight: 400; }
.round { width: 44px; height: 44px; border-radius: 50%; border: var(--bw) solid var(--edge); background: var(--surface); box-shadow: var(--sh-s); display: grid; place-items: center; flex: none; padding: 0; }
.round svg { width: 20px; height: 20px; }
.round:disabled { opacity: .35; box-shadow: none; }
main { padding-block: 6px 130px; display: grid; gap: 22px; }
section { display: grid; gap: 12px; min-width: 0; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding-bottom: max(12px, env(safe-area-inset-bottom)); pointer-events: none; }
.tabbar .pill { pointer-events: auto; margin: 0 auto; width: min(420px, calc(100% - 24px)); background: var(--block-ink); border-radius: 999px; display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: center; padding: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.tabbar button { background: none; border: 0; color: #9E97B3; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; padding: 7px 0; border-radius: 999px; min-height: 52px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--block-ink); background: var(--sun); }
.tabbar .mic { width: 72px; height: 72px; margin: -30px auto 0; border-radius: 50%; background: var(--tomato); color: var(--block-ink); border: 3px solid var(--block-ink); box-shadow: 0 4px 0 var(--block-ink); display: grid; place-items: center; }
.tabbar .mic svg { width: 30px; height: 30px; }
.tabbar .mic:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--block-ink); }

/* Blocs */
.card { background: var(--surface); border: var(--bw) solid var(--edge); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.blk { border: var(--bw) solid var(--edge); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; color: var(--block-ink); display: grid; gap: 10px; min-width: 0; }
.blk .muted { color: rgba(21, 17, 30, .68); }
.b-tomato { background: var(--tomato); } .b-cobalt { background: var(--cobalt); color: #fff; } .b-sun { background: var(--sun); } .b-mint { background: var(--mint); } .b-lilac { background: var(--lilac); } .b-pink { background: var(--pink); } .b-sky { background: var(--sky); }
.b-cobalt .muted { color: rgba(255, 255, 255, .75); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { border: var(--bw) solid var(--edge); background: var(--surface); color: var(--text); border-radius: 999px; padding: 10px 16px; min-height: 46px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--sh-s); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.ink { background: var(--block-ink); color: #fff; }
.btn.hot { background: var(--tomato); color: var(--block-ink); }
.btn.sun { background: var(--sun); color: var(--block-ink); }
.btn.small { min-height: 40px; padding: 7px 13px; font-size: 14px; }
.btn.flat { box-shadow: none; }
.btn:disabled { opacity: .5; box-shadow: none; }
.chip { border: var(--bw) solid var(--edge); background: var(--surface); border-radius: 999px; padding: 7px 13px; min-height: 40px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--sun); color: var(--block-ink); }
.scroller { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 4px 6px 2px; scrollbar-width: none; margin-right: -16px; flex-shrink: 0; min-height: 50px; }
.scroller::-webkit-scrollbar { display: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; border: 2px solid var(--edge); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--block-ink); }
.t-ok { background: var(--ok); } .t-warn { background: var(--warn); } .t-over { background: var(--over); } .t-none { background: var(--soft); color: var(--text); } .t-blue { background: var(--sky); }
input[type="number"], input[type="text"], input[type="password"], input[type="date"], input[type="search"], select, textarea { border: var(--bw) solid var(--edge); background: var(--surface); border-radius: 14px; padding: 10px 12px; min-height: 46px; min-width: 0; font-size: 16px; }
textarea { width: 100%; resize: vertical; min-height: 90px; }
label.field { display: grid; gap: 5px; font-size: 13px; font-weight: 700; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.note { border: var(--bw) solid var(--edge); border-radius: 16px; padding: 12px 14px; font-size: 15px; background: var(--sun); color: var(--block-ink); }
.note.info { background: var(--sky); }
.empty { border: var(--bw) dashed var(--muted); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); font-size: 15px; }
.stepper { display: inline-flex; align-items: center; border: var(--bw) solid var(--edge); border-radius: 999px; background: var(--surface); color: var(--text); overflow: hidden; }
.stepper button { border: 0; background: none; width: 44px; height: 42px; font-size: 20px; font-weight: 800; color: inherit; }
.stepper .v { min-width: 46px; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 19px; }
.toggle { width: 54px; height: 32px; border-radius: 999px; border: var(--bw) solid var(--edge); background: var(--soft); position: relative; flex: none; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: var(--surface); border: 2px solid var(--edge); transition: left .15s; }
.toggle[aria-pressed="true"] { background: var(--mint); }
.toggle[aria-pressed="true"]::after { left: 25px; }
.segbar { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.segbar i { height: 16px; border-radius: 4px; background: rgba(21, 17, 30, .16); border: 1.5px solid rgba(21, 17, 30, .45); }
.segbar i.on { background: var(--block-ink); border-color: var(--block-ink); }
.segbar i.over { background: #fff; border-color: var(--block-ink); }
.meter { height: 12px; border-radius: 999px; border: 2px solid currentColor; overflow: hidden; }
.meter i { display: block; height: 100%; background: currentColor; border-radius: 999px; }

/* Jour */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { border: var(--bw) solid var(--edge); border-radius: 14px; background: var(--surface); color: var(--text); padding: 6px 0 7px; display: grid; justify-items: center; gap: 1px; min-height: 64px; }
.wd .l { font-family: var(--f-mono); font-size: 10px; }
.wd .n { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1; }
.wd .s { width: 7px; height: 7px; border-radius: 50%; }
.wd.ok { background: var(--ok); color: var(--block-ink); } .wd.warn { background: var(--warn); color: var(--block-ink); } .wd.over { background: var(--over); color: var(--block-ink); }
.wd[aria-pressed="true"] { box-shadow: var(--sh-s); transform: translateY(-3px); }
.wd:disabled { opacity: .3; border-style: dashed; }
.wd .s.on { background: var(--block-ink); }
.hero-kcal .big { font-size: clamp(64px, 22vw, 96px); }
.quick { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; background: var(--surface); border: var(--bw) solid var(--edge); border-radius: 999px; box-shadow: var(--sh); padding: 5px; }
.quick input { border: 0; background: transparent; min-height: 44px; padding: 0 6px; outline: none; font-size: 16px; }
.quick .round { box-shadow: none; width: 44px; height: 44px; }
.slot { border: var(--bw) solid var(--edge); border-radius: var(--r); background: var(--surface); box-shadow: var(--sh); overflow: hidden; }
.slot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: var(--bw) solid var(--edge); color: var(--block-ink); }
.slot-head b { font-family: var(--f-display); font-size: 19px; font-weight: 800; }
.slot-body { padding: 8px 10px 10px; display: grid; gap: 6px; }
.meal { border: 0; background: none; text-align: left; padding: 4px; border-radius: 12px; width: 100%; display: grid; gap: 6px; color: var(--text); }
.meal:active { background: var(--soft); }
.item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; }
.emo { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--edge); background: var(--soft); display: grid; place-items: center; font-size: 21px; }
.item small { display: block; color: var(--muted); font-size: 13px; }
.item .k { font-family: var(--f-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.addline { border: 2px dashed var(--muted); background: none; border-radius: 12px; padding: 10px; min-height: 44px; font-weight: 700; color: var(--muted); text-align: left; }
.pain { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.pain button { aspect-ratio: 1; min-width: 0; border: 2px solid var(--edge); border-radius: 9px; background: var(--surface); font-family: var(--f-display); font-weight: 800; font-size: 14px; padding: 0; min-height: 30px; }
.pain button[aria-pressed="true"] { background: var(--sun); color: var(--block-ink); }

/* Journal */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .dow { font-family: var(--f-mono); font-size: 10px; text-align: center; color: var(--muted); }
.cell { aspect-ratio: 1 / 1.15; border: 2px solid var(--edge); border-radius: 12px; background: var(--surface); padding: 4px 2px; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; color: var(--text); min-width: 0; }
.cell .dn { font-family: var(--f-display); font-weight: 800; font-size: 16px; line-height: 1; }
.cell .dk { font-size: 10px; font-weight: 700; align-self: center; font-variant-numeric: tabular-nums; }
.cell .mk { display: flex; gap: 2px; height: 6px; }
.cell .mk i { width: 6px; height: 6px; border-radius: 50%; background: var(--block-ink); }
.cell.ok, .cell.warn, .cell.over { color: var(--block-ink); }
.cell.ok { background: var(--ok); } .cell.warn { background: var(--warn); } .cell.over { background: var(--over); }
.cell:disabled { opacity: .3; border-style: dashed; }
.cell.out { visibility: hidden; }
.cell.today { box-shadow: var(--sh-s); }
.dcard { text-align: left; width: 100%; color: var(--text); }
.emrow { font-size: 22px; letter-spacing: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Corps */
.stage { background: var(--stage); border: var(--bw) solid var(--edge); border-radius: 24px; box-shadow: var(--sh); padding: 14px 10px 12px; color: #F4F0FF; display: grid; gap: 10px; }
.stage .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-inline: -4px; }
.stage .fig { display: grid; justify-items: center; gap: 2px; }
.stage .fig span { font-family: var(--f-mono); font-size: 10px; color: #A79FBC; }
.stage svg { width: 100%; height: auto; display: block; }
.mu { cursor: pointer; }
.mu path { transition: fill .35s; }
.mu:focus { outline: none; }
.mu:focus-visible path:nth-child(3n+1), .mu.sel path:nth-child(3n+1) { stroke: #FFFFFF; stroke-width: 6; }
.heat { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 10px; color: #A79FBC; }
.heat span { display: inline-flex; align-items: center; gap: 4px; }
.heat i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid #000; }
.mdetail { background: var(--surface); color: var(--text); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; border: var(--bw) solid var(--edge); }
.mdetail .exl { display: grid; gap: 4px; font-size: 14px; }
.mdetail .exl div { display: flex; justify-content: space-between; gap: 8px; }
.tpls { display: grid; grid-template-columns: 1fr; gap: 10px; }
.tpl { text-align: left; color: var(--block-ink); }
.tpl b { font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.mus { display: flex; flex-wrap: wrap; gap: 4px; }
.mus span { font-size: 12px; font-weight: 700; border: 2px solid var(--edge); border-radius: 8px; padding: 1px 7px; background: var(--sun); color: var(--block-ink); }
.mus span.sec { background: var(--soft); color: var(--text); }
.target { border: 2px solid var(--edge); border-radius: 12px; padding: 8px 10px; background: var(--soft); font-size: 14px; }
.target b { font-family: var(--f-display); font-size: 18px; }
.set { display: grid; grid-template-columns: 22px 1fr 1fr 58px 46px; gap: 6px; align-items: center; }
.set .pv { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; }
.set .n { font-family: var(--f-display); font-weight: 800; color: var(--muted); text-align: center; }
.set input { width: 100%; text-align: center; font-family: var(--f-display); font-size: 20px; font-weight: 800; padding: 6px; }
.set .ok { width: 46px; height: 46px; border-radius: 14px; border: var(--bw) solid var(--edge); background: var(--surface); font-size: 18px; padding: 0; }
.set .ok.done { background: var(--mint); color: var(--block-ink); }
.set .ok.pr { background: var(--sun); color: var(--block-ink); }
.sethead { display: grid; grid-template-columns: 22px 1fr 1fr 58px 46px; gap: 6px; text-align: center; }
.demo { position: relative; height: 0; padding-top: 66.667%; max-width: 100%; border: var(--bw) solid var(--edge); border-radius: 16px; overflow: hidden; background: #000; margin-top: 6px; }
.demo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.demo img:nth-child(2) { animation: demo 2.8s ease-in-out infinite; }
@keyframes demo { 0%, 30% { opacity: 0; } 50%, 80% { opacity: 1; } 100% { opacity: 0; } }
.demo-tag { position: absolute; left: 8px; bottom: 8px; background: rgba(21, 17, 30, .8); color: #fff; padding: 3px 8px; border-radius: 999px; font-size: 10px; }
.thumb { position: relative; width: 60px; height: 44px; flex: none; padding: 0; border: 2px solid var(--edge); border-radius: 10px; overflow: hidden; background: #000; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .85; }
.thumb span { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 16px; text-shadow: 0 1px 3px #000; }
/* Récap animé, annuler, gestes */
.toast-undo { margin-left: 10px; background: var(--sun); color: var(--block-ink); border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 14px; }
#story { position: fixed; inset: 0; z-index: 35; background: var(--block-ink); display: grid; padding: calc(env(safe-area-inset-top) + 14px) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
#story[hidden] { display: none; }
.story-bars { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 16px; right: 16px; display: flex; gap: 4px; z-index: 3; }
.story-bars i { flex: 1; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .3); }
.story-bars i.done { background: #fff; }
.story-bars i.on { background: var(--sun); }
.story-x { position: absolute; top: calc(env(safe-area-inset-top) + 22px); right: 16px; z-index: 4; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .35); color: #fff; font-size: 18px; }
.story-slide { border: 3px solid #000; border-radius: 28px; margin-top: 78px; padding: 28px 22px; display: grid; align-content: center; gap: 14px; color: var(--block-ink); box-shadow: 6px 6px 0 #000; animation: storyIn .35s cubic-bezier(.2, .9, .3, 1.2); position: relative; z-index: 2; }
.story-slide.b-cobalt { color: #fff; }
@keyframes storyIn { from { transform: scale(.92) rotate(-1.5deg); opacity: 0; } to { transform: none; opacity: 1; } }
.story-em { font-size: 64px; line-height: 1; }
.story-big { font-family: var(--f-display); font-weight: 800; font-size: clamp(56px, 18vw, 92px); line-height: .9; letter-spacing: -.03em; }
.story-line { font-size: 19px; line-height: 1.35; font-weight: 600; }
.story-nav { position: absolute; top: 0; bottom: 0; width: 35%; border: 0; background: transparent; z-index: 1; }
.story-nav.prev { left: 0; } .story-nav.next { right: 0; width: 65%; }
.story-slide .btn { position: relative; z-index: 3; justify-self: start; }
.stage-seg { background: transparent; border-color: #000; }
.stage-seg button { color: #F4F0FF; padding: 6px 10px; min-height: 34px; font-size: 12px; }
.stage-seg button + button { border-left-color: #000; }
.set .ok.pop { animation: pop .35s cubic-bezier(.2, .9, .3, 1.6); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
